name: Build Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "src/tailwind.css"
      - "public/css/**/*.css"
      - "package.json"
      - ".github/workflows/build-tailwind.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:css
      - name: Commit generated CSS
        run: |
          if git diff --quiet -- public/css/tailwind.css; then
            echo "No CSS changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/tailwind.css
          git commit -m "build: regenerate Tailwind CSS"
          git push origin HEAD:main
